<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="BlvHOYCpvIJRSZa-zDBJp92crt_aOxcPXyc-FZfwsIo" />
    <link rel="icon" type="image/png" href="./favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="WellFit — Workouts, real nutrition, and fitness tools built for people who would rather train than scroll." />
    <title>WellFit — Precision Fitness & Training</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('wellfit-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (systemDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
